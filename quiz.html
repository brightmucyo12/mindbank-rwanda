<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Quiz - MindBank Rwanda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-gray-900">

    <!-- Navbar -->
    <header class="bg-[#041a18] text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="dashboard.html" class="text-lg font-bold text-white flex items-center gap-2">
                <span>&larr;</span> Back to Dashboard
            </a>
            <span id="progressText" class="text-xs sm:text-sm bg-[#0b332f] px-3 py-1.5 rounded-full text-gray-200 border border-[#13423d]">
                Loading...
            </span>
        </div>
    </header>

    <!-- Quiz Card Container -->
    <main class="flex-grow max-w-2xl w-full mx-auto px-4 py-8 flex flex-col justify-center">
        
        <div class="bg-white rounded-3xl p-6 sm:p-10 shadow-sm border border-gray-100">
            
            <!-- Loading Screen -->
            <div id="loadingState" class="text-center py-12">
                <div class="w-8 h-8 border-4 border-[#059669] border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-gray-500 font-medium">Fetching provisional exam questions...</p>
            </div>

            <!-- Question Screen -->
            <div id="questionContainer" class="hidden">
                <div class="flex items-center justify-between mb-4">
                    <span id="categoryBadge" class="text-xs font-bold uppercase tracking-wider bg-emerald-50 text-[#059669] px-3 py-1 rounded-full">
                        Category
                    </span>
                    <span id="scoreTracker" class="text-sm font-semibold text-gray-500">
                        Score: 0
                    </span>
                </div>

                <h2 id="questionText" class="text-lg sm:text-xl font-bold text-gray-900 mb-6 leading-relaxed">
                    <!-- Question injected via JS -->
                </h2>

                <div id="optionsContainer" class="flex flex-col gap-3 mb-8">
                    <!-- Options injected via JS -->
                </div>

                <div class="flex justify-end pt-4 border-t border-gray-100">
                    <button id="nextBtn" class="hidden bg-[#059669] hover:bg-[#10b981] text-white font-bold px-8 py-3 rounded-2xl shadow-md transition transform active:scale-95">
                        Next Question &rarr;
                    </button>
                </div>
            </div>

            <!-- Completion Screen -->
            <div id="resultContainer" class="hidden text-center py-8">
                <div class="w-20 h-20 bg-emerald-100 text-[#059669] rounded-full flex items-center justify-center mx-auto text-3xl font-extrabold mb-4">
                    ✓
                </div>
                <h2 class="text-2xl sm:text-3xl font-extrabold text-gray-900 mb-2">Practice Completed!</h2>
                <p id="finalScoreText" class="text-gray-600 text-lg mb-8">You scored 0 out of 0</p>
                
                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <button onclick="location.reload()" class="bg-[#059669] hover:bg-[#10b981] text-white font-bold px-6 py-3 rounded-2xl transition">
                        Retake Test
                    </button>
                    <a href="dashboard.html" class="bg-[#041a18] hover:bg-black text-white font-bold px-6 py-3 rounded-2xl transition">
                        Return to Dashboard
                    </a>
                </div>
            </div>

        </div>

    </main>

    <script>
        // Check session authentication
        const storedUser = localStorage.getItem('user');
        if (!storedUser) {
            window.location.href = 'login.html';
        }

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        async function fetchQuestions() {
            try {
                const response = await fetch('/api/questions');
                const data = await response.json();

                if (data.success && data.questions.length > 0) {
                    questions = data.questions;
                    document.getElementById('loadingState').classList.add('hidden');
                    document.getElementById('questionContainer').classList.remove('hidden');
                    loadQuestion();
                } else {
                    document.getElementById('loadingState').innerHTML = '<p class="text-red-500 font-medium">No questions found in database.</p>';
                }
            } catch (err) {
                console.error('Fetch error:', err);
                document.getElementById('loadingState').innerHTML = '<p class="text-red-500 font-medium">Failed to connect to backend server.</p>';
            }
        }

        function loadQuestion() {
            answered = false;
            const q = questions[currentIndex];

            document.getElementById('progressText').textContent = `Question ${currentIndex + 1} of ${questions.length}`;
            document.getElementById('categoryBadge').textContent = q.category || 'General';
            document.getElementById('questionText').textContent = q.question_text;
            document.getElementById('nextBtn').classList.add('hidden');

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const options = [
                { key: 'A', text: q.option_a },
                { key: 'B', text: q.option_b },
                { key: 'C', text: q.option_c },
                { key: 'D', text: q.option_d }
            ];

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-2xl border border-gray-200 hover:border-[#059669] hover:bg-emerald-50/50 font-medium text-gray-800 transition flex items-center justify-between';
                btn.innerHTML = `<span><strong class="mr-2 text-[#059669]">${opt.key}.</strong> ${opt.text}</span>`;
                
                btn.onclick = () => selectAnswer(opt.key, btn, q.correct_answer);
                optionsContainer.appendChild(btn);
            });
        }

        function selectAnswer(selectedKey, selectedBtn, correctKey) {
            if (answered) return;
            answered = true;

            const buttons = document.getElementById('optionsContainer').querySelectorAll('button');

            buttons.forEach(btn => {
                btn.disabled = true;
                const key = btn.querySelector('strong').textContent.replace('.', '').trim();
                
                if (key === correctKey) {
                    btn.className = 'w-full text-left p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50 font-semibold text-emerald-900';
                } else if (key === selectedKey && key !== correctKey) {
                    btn.className = 'w-full text-left p-4 rounded-2xl border-2 border-red-500 bg-red-50 font-semibold text-red-900';
                } else {
                    btn.className = 'w-full text-left p-4 rounded-2xl border border-gray-200 opacity-50 font-medium text-gray-500';
                }
            });

            if (selectedKey === correctKey) {
                score++;
                document.getElementById('scoreTracker').textContent = `Score: ${score}`;
            }

            document.getElementById('nextBtn').classList.remove('hidden');
        }

        document.getElementById('nextBtn').onclick = () => {
            currentIndex++;
            if (currentIndex < questions.length) {
                loadQuestion();
            } else {
                document.getElementById('questionContainer').classList.add('hidden');
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('progressText').textContent = 'Test Complete';
                document.getElementById('finalScoreText').textContent = `You scored ${score} out of ${questions.length}`;
            }
        };

        fetchQuestions();
    </script>
</body>
</html>
