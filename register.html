<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Favicon Tags -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-2DREXFQGYZ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-2DREXFQGYZ');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - IZIdrive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .status-msg {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      display: none;
    }
    .status-msg.error { background-color: #FEE2E2; color: #991B1B; border: 1px solid #FCA5A5; display: block; }
    .status-msg.success { background-color: #DCFCE7; color: #166534; border: 1px solid #86EFAC; display: block; }
  </style>
</head>
<body class="min-h-screen flex flex-col text-gray-900 relative overflow-x-hidden">

  <!-- BACKGROUND DASHBOARD PREVIEW (Appears in the background) -->
  <div aria-hidden="true" class="absolute inset-0 opacity-40 pointer-events-none filter blur-[2px] z-0 p-4 sm:p-8 max-w-7xl mx-auto w-full">
    <div class="bg-[#041a18] text-white rounded-3xl p-6 sm:p-10 mb-8 shadow-xl">
      <span class="bg-[#059669] text-white text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full mb-3 inline-block">Free Access Active</span>
      <h1 class="text-3xl font-extrabold">Welcome back to your Study Hub!</h1>
      <p class="text-gray-300 mt-2">Master all 10 levels and practice provisional driving test questions.</p>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <span class="text-xs font-semibold text-gray-400 uppercase">Tests Completed</span>
        <h3 class="text-3xl font-extrabold text-[#041a18] mt-2">0</h3>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <span class="text-xs font-semibold text-gray-400 uppercase">Average Score</span>
        <h3 class="text-3xl font-extrabold text-[#041a18] mt-2">-- / 20</h3>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
        <span class="text-xs font-semibold text-gray-400 uppercase">Account Status</span>
        <h3 class="text-xl font-bold text-emerald-600 mt-2">Ready</h3>
      </div>
    </div>
  </div>

  <!-- FOREGROUND MODAL REGISTRATION CONTAINER -->
  <div class="relative z-10 flex-grow flex items-center justify-center p-4">
    <div class="bg-white/95 backdrop-blur-md w-full max-w-md p-8 rounded-3xl shadow-2xl border border-gray-100 my-8">
      
      <div class="text-center mb-6">
        <a href="index.html" class="inline-flex items-center gap-2 text-2xl font-bold text-[#041a18] mb-1">
          <img src="apple-touch-icon.png" alt="logo" class="w-10 h-10 rounded-xl object-contain">
          <span>IZIdrive</span>
        </a>
        <h1 class="text-2xl font-extrabold text-gray-900">Create Account</h1>
        <p class="text-sm text-gray-500 mt-1">Start your free learning journey instantly</p>
      </div>

      <form id="registrationForm" class="space-y-4">
        <div id="statusBanner" class="status-msg"></div>

        <div>
          <label class="block text-xs font-bold uppercase text-gray-600 mb-1" for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="w-full h-12 bg-gray-50 border border-gray-200 rounded-xl px-4 text-sm font-semibold focus:outline-none focus:border-[#059669]" placeholder="078XXXXXXX" maxlength="10" required>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-gray-600 mb-1" for="pin">4-Digit PIN</label>
          <input type="password" id="pin" name="pin" maxlength="4" placeholder="••••" class="w-full h-12 bg-gray-50 border border-gray-200 rounded-xl px-4 text-sm font-semibold focus:outline-none focus:border-[#059669]" required>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase text-gray-600 mb-1" for="re-pin">Re-enter PIN</label>
          <input type="password" id="re-pin" name="re_pin" maxlength="4" placeholder="••••" class="w-full h-12 bg-gray-50 border border-gray-200 rounded-xl px-4 text-sm font-semibold focus:outline-none focus:border-[#059669]" required>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-[#059669] hover:bg-[#10b981] text-white font-bold h-12 rounded-xl shadow-lg transition active:scale-95 text-sm uppercase tracking-wider mt-2">
          Register Now
        </button>
      </form>

      <div class="text-center mt-6">
        <a href="login.html" class="text-sm font-semibold text-gray-600 hover:text-[#059669] transition">Already have an account? <span class="underline">Sign In</span></a>
      </div>

    </div>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const statusBanner = document.getElementById('statusBanner');
      const submitBtn = document.getElementById('submitBtn');

      statusBanner.className = 'status-msg';
      statusBanner.textContent = '';

      const phone = document.getElementById('phone').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const rePin = document.getElementById('re-pin').value.trim();

      if (pin !== rePin) {
        statusBanner.className = 'status-msg error';
        statusBanner.textContent = 'PINs do not match. Please ensure both match.';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'CREATING ACCOUNT...';

      try {
        const response = await fetch('https://mindbank-rwanda-api.onrender.com/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, pin, plan: 'free', payment_method: 'none' })
        });

        const data = await response.json();

        if (response.ok) {
          statusBanner.className = 'status-msg success';
          statusBanner.textContent = 'Account created successfully! Redirecting...';
          localStorage.setItem('userPhone', phone);
          if (data.user) localStorage.setItem('user', JSON.stringify(data.user));

          setTimeout(() => {
            window.location.href = 'dashboard-index.html';
          }, 1000);
        } else {
          statusBanner.className = 'status-msg error';
          statusBanner.textContent = data.error || 'Registration failed. Please try again.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register Now';
        }
      } catch (err) {
        console.error('Fetch error:', err);
        statusBanner.className = 'status-msg error';
        statusBanner.textContent = 'Failed to connect to server. Please try again.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Register Now';
      }
    });
  </script>

</body>
</html>
