<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MINDbank Rwanda - Register</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    h2 {
      margin-bottom: 20px;
      color: #333333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555555;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0052a3;
    }
    .message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      display: none;
      text-align: center;
      font-size: 14px;
    }
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
    }
    .message.success {
      background-color: #d4edda;
      color: #155724;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Register & Pay</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="phone">Phone Number (10 Digits)</label>
        <input type="text" id="phone" placeholder="0788000000" maxlength="10" required>
      </div>

      <div class="form-group">
        <label for="pin">4-Digit PIN</label>
        <input type="password" id="pin" placeholder="1234" maxlength="4" required>
      </div>

      <div class="form-group">
        <label for="plan">Select Plan</label>
        <select id="plan" required>
          <option value="Basic">Basic Plan</option>
          <option value="Standard">Standard Plan</option>
          <option value="Premium">Premium Plan</option>
        </select>
      </div>

      <div class="form-group">
        <label for="payment_method">Payment Method</label>
        <select id="payment_method" required>
          <option value="MTN MoMo">MTN MoMo</option>
          <option value="Airtel Money">Airtel Money</option>
        </select>
      </div>

      <button type="submit" id="submitBtn">REGISTER & PAY</button>
    </form>

    <div id="statusMessage" class="message"></div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');

      const phone = document.getElementById('phone').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const plan = document.getElementById('plan').value;
      const payment_method = document.getElementById('payment_method').value;

      // Reset message status
      statusMessage.style.display = 'none';
      statusMessage.className = 'message';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Processing...';

      try {
        const response = await fetch('https://mindbank-rwanda-api.onrender.com/api/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ phone, pin, plan, payment_method })
        });

        const data = await response.json();

        if (response.ok) {
          statusMessage.className = 'message success';
          statusMessage.innerText = data.message || 'Registration successful!';
          statusMessage.style.display = 'block';

          // Optional: Clear form or redirect to login
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } else {
          statusMessage.className = 'message error';
          statusMessage.innerText = data.error || 'Registration failed.';
          statusMessage.style.display = 'block';
        }
      } catch (error) {
        console.error('Fetch error:', error);
        statusMessage.className = 'message error';
        statusMessage.innerText = 'Failed to connect to server. Please try again in a few moments.';
        statusMessage.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'REGISTER & PAY';
      }
    });
  </script>

</body>
</html>
